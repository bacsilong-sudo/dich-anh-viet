name: Build iOS app

on:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/ios-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: Build (unsigned, for iPhone)
        working-directory: ios
        run: |
          xcodebuild \
            -project DichAnhViet.xcodeproj \
            -target DichAnhViet \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        working-directory: ios/build/Release-iphoneos
        run: |
          mkdir -p Payload
          cp -R DichAnhViet.app Payload/
          zip -qry ../../DichAnhViet-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: DichAnhViet-ipa
          path: ios/DichAnhViet-unsigned.ipa
